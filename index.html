<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="考試倒數">
<title>考試倒數計時器</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: #f0f7f4;
    min-height: 100vh;
    padding: 24px 16px 40px;
    color: #1a2e25;
  }

  header {
    text-align: center;
    margin-bottom: 28px;
  }

  header h1 {
    font-size: 22px;
    font-weight: 700;
    color: #0f6e56;
    letter-spacing: 0.05em;
    margin-bottom: 4px;
  }

  header p {
    font-size: 13px;
    color: #5a8070;
  }

  .section-label {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 20px;
    font-weight: 700;
    color: #0f6e56;
    margin-bottom: 14px;
  }

  .section-label::before {
    content: '';
    display: block;
    width: 5px;
    height: 28px;
    background: #1D9E75;
    border-radius: 3px;
  }

  /* 倒數區塊 */
  .countdown-box {
    background: #fff;
    border: 2px solid #1D9E75;
    border-radius: 16px;
    padding: 8px 0;
    margin-bottom: 32px;
    box-shadow: 0 2px 12px rgba(29,158,117,0.08);
  }

  .countdown-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    gap: 12px;
  }

  .countdown-row + .countdown-row {
    border-top: 1px dashed #c5e4d9;
  }

  .exam-name {
    font-size: 17px;
    font-weight: 700;
    color: #1a2e25;
    min-width: 90px;
  }

  .days-wrap {
    display: flex;
    align-items: baseline;
    gap: 4px;
  }

  .days-num {
    font-size: 38px;
    font-weight: 700;
    color: #1D9E75;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    min-width: 80px;
    text-align: right;
  }

  .days-unit {
    font-size: 16px;
    color: #5a8070;
    font-weight: 500;
  }

  /* 考試日期區塊 */
  .date-box {
    background: #fff;
    border-radius: 16px;
    padding: 8px 0;
    margin-bottom: 32px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.05);
  }

  .date-row {
    padding: 14px 20px;
    border-bottom: 1px solid #eef5f2;
  }

  .date-row:last-child { border-bottom: none; }

  .date-exam {
    font-size: 15px;
    font-weight: 700;
    color: #0f6e56;
    margin-bottom: 4px;
  }

  .date-detail {
    font-size: 14px;
    color: #3a5a4a;
    line-height: 1.6;
  }

  .date-tag {
    display: inline-block;
    font-size: 11px;
    background: #e1f5ee;
    color: #0f6e56;
    border-radius: 99px;
    padding: 1px 8px;
    margin-left: 6px;
    font-weight: 500;
    vertical-align: middle;
  }

  /* 時間顯示 */
  .clock-wrap {
    text-align: center;
    margin-bottom: 28px;
    color: #5a8070;
    font-size: 13px;
  }

  #clock-time {
    font-size: 15px;
    font-weight: 500;
    color: #1a2e25;
  }

  footer {
    text-align: center;
    font-size: 12px;
    color: #8aaa9a;
    margin-top: 8px;
  }
</style>
</head>
<body>

<header>
  <h1>📅 考試倒數計時器</h1>
  <p id="today-date">載入中...</p>
</header>

<div class="clock-wrap">
  現在時間：<span id="clock-time">--:--:--</span>
</div>

<div class="section-label">考試倒數</div>

<div class="countdown-box">
  <div class="countdown-row">
    <span class="exam-name">115 分科</span>
    <div class="days-wrap">
      <span class="days-num" id="d0">—</span>
      <span class="days-unit">天</span>
    </div>
  </div>
  <div class="countdown-row">
    <span class="exam-name">116 學測</span>
    <div class="days-wrap">
      <span class="days-num" id="d1">—</span>
      <span class="days-unit">天</span>
    </div>
  </div>
  <div class="countdown-row">
    <span class="exam-name">116 統測</span>
    <div class="days-wrap">
      <span class="days-num" id="d2">—</span>
      <span class="days-unit">天</span>
    </div>
  </div>
  <div class="countdown-row">
    <span class="exam-name">116 會考</span>
    <div class="days-wrap">
      <span class="days-num" id="d3">—</span>
      <span class="days-unit">天</span>
    </div>
  </div>
</div>

<div class="section-label">考試日期</div>

<div class="date-box">
  <div class="date-row">
    <div class="date-exam">115 分科測驗</div>
    <div class="date-detail">2026 / 7 / 11（六）－ 7 / 12（日）</div>
  </div>
  <div class="date-row">
    <div class="date-exam">116 學科能力測驗</div>
    <div class="date-detail">2027 / 1 / 22（五）－ 1 / 24（日）</div>
  </div>
  <div class="date-row">
    <div class="date-exam">116 統一入學測驗 <span class="date-tag">預測</span></div>
    <div class="date-detail">2027 / 4 / 24（六）－ 4 / 25（日）</div>
  </div>
  <div class="date-row">
    <div class="date-exam">116 國中教育會考 <span class="date-tag">預測</span></div>
    <div class="date-detail">2027 / 5 / 22（六）－ 5 / 23（日）</div>
  </div>
</div>

<footer>資料來源：andyli.tw／大學入學考試中心基金會</footer>

<script>
  const exams = [
    { id: 'd0', date: '2026-07-11' },
    { id: 'd1', date: '2027-01-22' },
    { id: 'd2', date: '2027-04-24' },
    { id: 'd3', date: '2027-05-22' },
  ];

  const weekdays = ['日','一','二','三','四','五','六'];

  function calcDays(dateStr) {
    const now = new Date();
    const target = new Date(dateStr + 'T00:00:00');
    return Math.ceil((target - now) / (1000 * 60 * 60 * 24));
  }

  function pad(n) { return String(n).padStart(2, '0'); }

  function updateAll() {
    const now = new Date();

    // 今日日期
    const y = now.getFullYear();
    const m = now.getMonth() + 1;
    const d = now.getDate();
    const w = weekdays[now.getDay()];
    document.getElementById('today-date').textContent = `${y} 年 ${m} 月 ${d} 日（${w}）`;

    // 時鐘
    document.getElementById('clock-time').textContent =
      `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;

    // 倒數天數
    exams.forEach(({ id, date }) => {
      const days = calcDays(date);
      const el = document.getElementById(id);
      if (el) el.textContent = days > 0 ? days : '已結束';
    });
  }

  updateAll();
  setInterval(updateAll, 1000);
</script>
</body>
</html>
