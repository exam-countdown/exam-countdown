<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="考試倒數">
<title>考試倒數計時器</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: #ffffff;
    min-height: 100vh;
    padding: 16px 20px 60px;
    padding-top: max(16px, env(safe-area-inset-top));
    color: #1a1a1a;
  }

  .section-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 24px;
    font-weight: 700;
    color: #1a1a1a;
    margin-bottom: 14px;
  }
  .section-title::before {
    content: '';
    display: block;
    width: 6px;
    height: 30px;
    background: #1D9E75;
    border-radius: 3px;
    flex-shrink: 0;
  }

  .countdown-box {
    border: 2.5px solid #1D9E75;
    border-radius: 4px;
    padding: 8px;
    margin-bottom: 32px;
    text-align: center;
  }

  .countdown-row {
    display: flex;
    align-items: baseline;
    justify-content: center;
    padding: 10px 0;
  }

  .c-label {
    font-weight: 700;
    color: #1a1a1a;
    min-width: 120px;
    text-align: right;
    padding-right: 10px;
    font-size: 20px;
    white-space: nowrap;
  }

  .c-days {
    color: #1D9E75;
    font-size: 34px;
    font-weight: 700;
    min-width: 72px;
    text-align: right;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }

  .c-unit {
    font-size: 18px;
    color: #1a1a1a;
    padding-left: 5px;
  }

  .date-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .date-row {
    font-size: 13px;
    color: #1a1a1a;
    line-height: 1.5;
    white-space: nowrap;
  }

  .predicted {
    color: #888;
    font-size: 12px;
  }
</style>
</head>
<body>

<div class="section-title">考試倒數</div>

<div class="countdown-box">
  <div class="countdown-row">
    <span class="c-label">【115分科】</span>
    <span class="c-days" id="d0">—</span>
    <span class="c-unit">天</span>
  </div>
  <div class="countdown-row">
    <span class="c-label">【116學測】</span>
    <span class="c-days" id="d1">—</span>
    <span class="c-unit">天</span>
  </div>
  <div class="countdown-row">
    <span class="c-label">【116統測】</span>
    <span class="c-days" id="d2">—</span>
    <span class="c-unit">天</span>
  </div>
  <div class="countdown-row">
    <span class="c-label">【116會考】</span>
    <span class="c-days" id="d3">—</span>
    <span class="c-unit">天</span>
  </div>
</div>

<div class="section-title">考試日期</div>

<div class="date-list">
  <div class="date-row">115分科日期：2026/7/13(一) – 2026/7/14(二)。</div>
  <div class="date-row">116學測日期：2027/1/22(五) – 2027/1/24(日)。</div>
  <div class="date-row">116統測日期：2027/4/24(六) – 2027/4/25(日)。<span class="predicted">（預測）</span></div>
  <div class="date-row">116會考日期：2027/5/15(六) – 2027/5/16(日)。</div>
</div>

<script>
  const dates = ['2026-07-13','2027-01-22','2027-04-24','2027-05-15'];

  function calcDays(dateStr) {
    const now = new Date();
    const target = new Date(dateStr + 'T00:00:00');
    return Math.ceil((target - now) / (1000 * 60 * 60 * 24));
  }

  function update() {
    dates.forEach((d, i) => {
      const el = document.getElementById('d' + i);
      const days = calcDays(d);
      if (el) el.textContent = days > 0 ? days : '已結束';
    });
  }

  update();
  setInterval(update, 60000);
</script>
</body>
</html>
